<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#0b1526" />
      <stop offset="0.5" stop-color="#060a12" />
      <stop offset="1" stop-color="#020306" />
    </linearGradient>

    <radialGradient id="glowTop" cx="0.74" cy="0.05" r="0.62">
      <stop offset="0" stop-color="#4a7bdc" stop-opacity="0.72" />
      <stop offset="0.55" stop-color="#2b57ad" stop-opacity="0.22" />
      <stop offset="1" stop-color="#2b57ad" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottom" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#1c3b7a" stop-opacity="0.58" />
      <stop offset="1" stop-color="#1c3b7a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c6ff" stop-opacity="0" />
      <stop offset="0.42" stop-color="#a9c6ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12213c" stop-opacity="0.9" />
      <stop offset="1" stop-color="#04070d" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.45" stop-color="#020306" stop-opacity="0" />
      <stop offset="1" stop-color="#020306" stop-opacity="0.82" />
    </radialGradient>

    <pattern id="grid" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M88 0H0V88" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)" />
  <rect width="1600" height="900" fill="url(#glowTop)" />
  <rect width="1600" height="900" fill="url(#glowBottom)" />
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.85" />

  <!-- 光柱 -->
  <g filter="url(#soft)" opacity="0.9">
    <rect x="1060" y="60" width="86" height="660" fill="url(#beam)" transform="rotate(13 1103 390)" />
    <rect x="1268" y="-20" width="42" height="760" fill="url(#beam)" transform="rotate(13 1289 360)" />
    <rect x="900" y="120" width="24" height="600" fill="url(#beam)" transform="rotate(13 912 420)" />
  </g>

  <!-- 建筑体块：底部天际线 -->
  <g filter="url(#soft)" opacity="0.85">
    <rect x="960" y="470" width="120" height="430" fill="url(#tower)" />
    <rect x="1110" y="380" width="86" height="520" fill="url(#tower)" />
    <rect x="1220" y="540" width="150" height="360" fill="url(#tower)" />
    <rect x="1400" y="430" width="110" height="470" fill="url(#tower)" />
    <rect x="1520" y="580" width="120" height="320" fill="url(#tower)" />
  </g>

  <!-- 建筑顶部蓝色微光 -->
  <g opacity="0.5">
    <rect x="962" y="468" width="116" height="2" fill="#7fa7f5" />
    <rect x="1112" y="378" width="82" height="2" fill="#7fa7f5" />
    <rect x="1222" y="538" width="146" height="2" fill="#5f88d8" />
    <rect x="1402" y="428" width="106" height="2" fill="#5f88d8" />
  </g>

  <rect width="1600" height="900" fill="url(#vignette)" />
</svg>
